[project]
name = "biblio-companion"
version = "0.1.0"
description = "Biblio AI Café Companion — single-café AI agent, knowledge base and ordering (local hackathon build)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai-agents>=0.24.0",
    "httpx>=0.27",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
ingest = [
    "apify-client>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.uv]
default-groups = ["dev", "ingest"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
